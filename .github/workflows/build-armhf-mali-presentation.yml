name: Build Ruffle ARMHF Mali Presentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-armhf-mali-presentation.yml'

permissions:
  contents: read

jobs:
  build-armhf:
    name: armv7-unknown-linux-gnueabihf-bionic-mali-presentation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6

      - name: Checkout pinned upstream Ruffle
        uses: actions/checkout@v6
        with:
          repository: ruffle-rs/ruffle
          ref: e40ccc8ae95401e6c320f0e524b1c4077f545822
          path: ruffle-src

      - name: Build patched ARMHF Ruffle inside Ubuntu 18.04 userspace
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:18.04 \
            bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              cat >/etc/apt/sources.list <<"EOF"
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic main universe multiverse restricted
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic-updates main universe multiverse restricted
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic-security main universe multiverse restricted
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports bionic main universe multiverse restricted
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports bionic-updates main universe multiverse restricted
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports bionic-security main universe multiverse restricted
          EOF

              dpkg --add-architecture armhf
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git file python3 clang libclang-dev build-essential \
                gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
                pkg-config default-jre-headless \
                libasound2-dev:armhf libudev-dev:armhf libfontconfig1-dev:armhf libssl-dev:armhf

              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig

              test -f /usr/lib/arm-linux-gnueabihf/pkgconfig/freetype2.pc
              sed -i "s/^Version:.*/Version: 24.3.18/" /usr/lib/arm-linux-gnueabihf/pkgconfig/freetype2.pc

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              rustup target add armv7-unknown-linux-gnueabihf

              mkdir -p ruffle-src/.cargo
              cat >ruffle-src/.cargo/config.toml <<"EOF"
          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-linux-gnueabihf-gcc"
          ar = "arm-linux-gnueabihf-ar"
          EOF

              python3 - <<"PY"
          from pathlib import Path
          p = Path("ruffle-src/frontend-utils/src/backends/ui/freetype_font_renderer.rs")
          s = p.read_text()
          replacements = {
              "convert_26_6_to_twips(self.size_metrics().ascender)": "convert_26_6_to_twips(self.size_metrics().ascender.into())",
              "convert_26_6_to_twips(-self.size_metrics().descender)": "convert_26_6_to_twips((-self.size_metrics().descender).into())",
              "convert_26_6_to_twips(glyph.advance().x)": "convert_26_6_to_twips(glyph.advance().x.into())",
              "convert_26_6_to_twips(kerning.x)": "convert_26_6_to_twips(kerning.x.into())",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"expected ARMHF FreeType expression not found: {old}")
              s = s.replace(old, new)
          p.write_text(s)
          PY

              cd ruffle-src
              export CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc
              export CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++
              export AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar

              cargo fetch --locked

              python3 - <<"PY"
          from pathlib import Path
          matches = list(Path.home().glob(".cargo/registry/src/*/wgpu-hal-27.0.4/src/gles/egl.rs"))
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one wgpu-hal 27.0.4 egl.rs, found {matches}")
          p = matches[0]
          s = p.read_text()
          old = "if cfg!(target_os = \"android\") || cfg!(windows) || cfg!(target_env = \"ohos\") {"
          new = """if cfg!(target_os = \"android\")
                        || cfg!(windows)
                        || cfg!(target_env = \"ohos\")
                        || cfg!(all(target_os = \"linux\", target_arch = \"arm\"))
                    {"""
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one wgpu-hal EGL threshold condition, found {count}")
          s = s.replace(old, new, 1)
          p.write_text(s)
          print(f"Patched ARM Linux EGL presentation acceptance in {p}")
          PY

              cargo build --locked \
                --package ruffle_desktop \
                --release \
                --target armv7-unknown-linux-gnueabihf \
                --features jpegxr,fontconfig-dlopen

              mkdir -p /work/artifact-mali
              cp target/armv7-unknown-linux-gnueabihf/release/ruffle_desktop /work/artifact-mali/ruffle
              cp LICENSE.md /work/artifact-mali/LICENSE.md
              cp README.md /work/artifact-mali/README.md
              chmod +x /work/artifact-mali/ruffle
            '

      - name: Verify patched ARMHF compatibility
        run: |
          set -euxo pipefail
          file artifact-mali/ruffle
          readelf -h artifact-mali/ruffle
          readelf --version-info artifact-mali/ruffle | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tee glibc-versions-mali.txt
          MAX_GLIBC="$(tail -n 1 glibc-versions-mali.txt)"
          test "$MAX_GLIBC" = "GLIBC_2.27"
          readelf -d artifact-mali/ruffle | grep NEEDED | tee needed-libs-mali.txt
          ! grep -q 'libssl.so.3' needed-libs-mali.txt
          ! grep -q 'libcrypto.so.3' needed-libs-mali.txt
          sha256sum artifact-mali/ruffle | tee ruffle-mali.sha256

      - name: Package artifact
        run: |
          tar -C artifact-mali -czf ruffle-armhf-bionic-mali-presentation.tar.gz .
          sha256sum ruffle-armhf-bionic-mali-presentation.tar.gz | tee ruffle-armhf-bionic-mali-presentation.tar.gz.sha256

      - name: Upload ARMHF Mali artifact
        uses: actions/upload-artifact@v7
        with:
          name: ruffle-armhf-bionic-mali-presentation
          path: |
            ruffle-armhf-bionic-mali-presentation.tar.gz
            ruffle-armhf-bionic-mali-presentation.tar.gz.sha256
            ruffle-mali.sha256
            glibc-versions-mali.txt
            needed-libs-mali.txt
          if-no-files-found: error
