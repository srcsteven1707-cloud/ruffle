name: Bundle Bionic ARMHF XKB Runtime

on:
  push:
    paths:
      - '.github/workflows/bundle-bionic-xkb.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Build isolated Ubuntu 18.04 ARMHF XKB bundle
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/out:/out" \
            ubuntu:18.04 bash -lc '
              set -eux
              printf "%s\n" \
                "deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic main universe" \
                "deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic-updates main universe" \
                "deb [arch=amd64] http://security.ubuntu.com/ubuntu bionic-security main universe" \
                "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports bionic main universe" \
                "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports bionic-updates main universe" \
                "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports bionic-security main universe" \
                > /etc/apt/sources.list
              dpkg --add-architecture armhf
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                file \
                binutils \
                libxkbcommon-x11-0:armhf \
                libxkbcommon0:armhf \
                libxcb-xkb1:armhf \
                libxcb1:armhf \
                libc6:armhf
              mkdir -p /tmp/bundle/lib
              cp -L /usr/lib/arm-linux-gnueabihf/libxkbcommon-x11.so.0 /tmp/bundle/lib/
              cp -L /usr/lib/arm-linux-gnueabihf/libxkbcommon.so.0 /tmp/bundle/lib/
              cp -L /usr/lib/arm-linux-gnueabihf/libxcb-xkb.so.1 /tmp/bundle/lib/
              cp -L /usr/lib/arm-linux-gnueabihf/libxcb.so.1 /tmp/bundle/lib/
              file /tmp/bundle/lib/*
              for f in /tmp/bundle/lib/*; do
                echo "=== $f ==="
                readelf -d "$f" | grep NEEDED || true
                readelf --version-info "$f" | grep -o "GLIBC_[0-9.]*" | sort -Vu | tail -1 || true
              done
              tar -C /tmp/bundle -czf /out/ruffle-bionic-armhf-xkb-runtime.tar.gz lib
              sha256sum /out/ruffle-bionic-armhf-xkb-runtime.tar.gz > /out/ruffle-bionic-armhf-xkb-runtime.tar.gz.sha256
            '
      - uses: actions/upload-artifact@v4
        with:
          name: ruffle-bionic-armhf-xkb-runtime
          path: |
            out/ruffle-bionic-armhf-xkb-runtime.tar.gz
            out/ruffle-bionic-armhf-xkb-runtime.tar.gz.sha256
