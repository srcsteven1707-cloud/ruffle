name: Build Ruffle ARMHF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-armhf.yml'

permissions:
  contents: read

jobs:
  build-armhf:
    name: armv7-unknown-linux-gnueabihf
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6

      - name: Checkout upstream Ruffle
        uses: actions/checkout@v6
        with:
          repository: ruffle-rs/ruffle
          ref: master
          path: ruffle-src

      - name: Install Rust ARMHF target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf

      - name: Configure Ubuntu ARMHF package sources
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/armhf.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update

      - name: Install cross compiler and ARMHF development libraries
        run: |
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            pkg-config \
            default-jre-headless \
            libasound2-dev:armhf \
            libudev-dev:armhf \
            libfontconfig1-dev:armhf \
            libssl-dev:armhf

      - name: Configure ARMHF cross compilation
        run: |
          mkdir -p ruffle-src/.cargo
          cat > ruffle-src/.cargo/config.toml <<'EOF'
          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-linux-gnueabihf-gcc"
          ar = "arm-linux-gnueabihf-ar"
          EOF

      - name: Patch FreeType 32-bit integer widths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ruffle-src/frontend-utils/src/backends/ui/freetype_font_renderer.rs')
          s = p.read_text()
          replacements = {
              'convert_26_6_to_twips(self.size_metrics().ascender)':
                  'convert_26_6_to_twips(self.size_metrics().ascender.into())',
              'convert_26_6_to_twips(-self.size_metrics().descender)':
                  'convert_26_6_to_twips((-self.size_metrics().descender).into())',
              'convert_26_6_to_twips(glyph.advance().x)':
                  'convert_26_6_to_twips(glyph.advance().x.into())',
              'convert_26_6_to_twips(kerning.x)':
                  'convert_26_6_to_twips(kerning.x.into())',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected source pattern not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build Ruffle desktop ARMHF
        working-directory: ruffle-src
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
        run: |
          cargo build --locked \
            --package ruffle_desktop \
            --release \
            --target armv7-unknown-linux-gnueabihf \
            --features jpegxr,fontconfig-dlopen

      - name: Inspect ARMHF binary
        run: |
          file ruffle-src/target/armv7-unknown-linux-gnueabihf/release/ruffle_desktop
          arm-linux-gnueabihf-readelf -h ruffle-src/target/armv7-unknown-linux-gnueabihf/release/ruffle_desktop
          arm-linux-gnueabihf-readelf -d ruffle-src/target/armv7-unknown-linux-gnueabihf/release/ruffle_desktop || true

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp ruffle-src/target/armv7-unknown-linux-gnueabihf/release/ruffle_desktop artifact/ruffle
          cp ruffle-src/LICENSE.md artifact/LICENSE.md
          cp ruffle-src/README.md artifact/README.md
          chmod +x artifact/ruffle
          tar -C artifact -czf ruffle-armhf.tar.gz .
          sha256sum ruffle-armhf.tar.gz | tee ruffle-armhf.tar.gz.sha256

      - name: Upload ARMHF artifact
        uses: actions/upload-artifact@v7
        with:
          name: ruffle-armhf
          path: |
            ruffle-armhf.tar.gz
            ruffle-armhf.tar.gz.sha256
          if-no-files-found: error
