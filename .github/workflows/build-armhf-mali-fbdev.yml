name: Build Ruffle ARMHF Mali fbdev Surface

on:
  push:
    branches: [test18-native-fbdev-surface]
    paths:
      - '.github/workflows/build-armhf-mali-fbdev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armhf:
    name: armv7-unknown-linux-gnueabihf-bionic-mali-fbdev
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v6

      - name: Checkout pinned upstream Ruffle
        uses: actions/checkout@v6
        with:
          repository: ruffle-rs/ruffle
          ref: e40ccc8ae95401e6c320f0e524b1c4077f545822
          path: ruffle-src

      - name: Build patched ARMHF Ruffle inside Ubuntu 18.04 userspace
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ubuntu:18.04 \
            bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              cat >/etc/apt/sources.list <<"EOF"
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic main universe multiverse restricted
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic-updates main universe multiverse restricted
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu bionic-security main universe multiverse restricted
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports bionic main universe multiverse restricted
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports bionic-updates main universe multiverse restricted
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports bionic-security main universe multiverse restricted
          EOF

              dpkg --add-architecture armhf
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git file python3 clang libclang-dev build-essential \
                gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
                pkg-config default-jre-headless \
                libasound2-dev:armhf libudev-dev:armhf libfontconfig1-dev:armhf libssl-dev:armhf

              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
              export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig

              test -f /usr/lib/arm-linux-gnueabihf/pkgconfig/freetype2.pc
              sed -i "s/^Version:.*/Version: 24.3.18/" /usr/lib/arm-linux-gnueabihf/pkgconfig/freetype2.pc

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              rustup target add armv7-unknown-linux-gnueabihf

              mkdir -p ruffle-src/.cargo
              cat >ruffle-src/.cargo/config.toml <<"EOF"
          [target.armv7-unknown-linux-gnueabihf]
          linker = "arm-linux-gnueabihf-gcc"
          ar = "arm-linux-gnueabihf-ar"
          EOF

              python3 - <<"PY"
          from pathlib import Path
          p = Path("ruffle-src/frontend-utils/src/backends/ui/freetype_font_renderer.rs")
          s = p.read_text()
          replacements = {
              "convert_26_6_to_twips(self.size_metrics().ascender)": "convert_26_6_to_twips(self.size_metrics().ascender.into())",
              "convert_26_6_to_twips(-self.size_metrics().descender)": "convert_26_6_to_twips((-self.size_metrics().descender).into())",
              "convert_26_6_to_twips(glyph.advance().x)": "convert_26_6_to_twips(glyph.advance().x.into())",
              "convert_26_6_to_twips(kerning.x)": "convert_26_6_to_twips(kerning.x.into())",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"expected ARMHF FreeType expression not found: {old}")
              s = s.replace(old, new)
          p.write_text(s)
          PY

              cd ruffle-src
              export CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc
              export CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++
              export AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar

              cargo fetch --locked

              python3 - <<"PY"
          from pathlib import Path
          matches = list(Path.home().glob(".cargo/registry/src/*/wgpu-hal-27.0.4/src/gles/egl.rs"))
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one wgpu-hal 27.0.4 egl.rs, found {matches}")
          p = matches[0]
          s = p.read_text()

          # Test14 patch: accept tier-1 presentation configs on Linux ARM.
          old_threshold = "if cfg!(target_os = \"android\") || cfg!(windows) || cfg!(target_env = \"ohos\") {"
          new_threshold = """if cfg!(target_os = \"android\")
                        || cfg!(windows)
                        || cfg!(target_env = \"ohos\")
                        || cfg!(all(target_os = \"linux\", target_arch = \"arm\"))
                    {"""
          if s.count(old_threshold) != 1:
              raise SystemExit("expected exactly one EGL tier threshold condition")
          s = s.replace(old_threshold, new_threshold, 1)

          # Test17-proven DarkFate Mali native window: 16-byte fbdev descriptor.
          old_native = """                let mut wl_window = None;
                let (mut temp_xlib_handle, mut temp_xcb_handle);
                let native_window_ptr = match (self.wsi.kind, self.raw_window_handle) {
                    (WindowKind::Unknown | WindowKind::X11, Rwh::Xlib(handle)) => {
                        temp_xlib_handle = handle.window;
                        ptr::from_mut(&mut temp_xlib_handle).cast::<ffi::c_void>()
                    }
                    (WindowKind::AngleX11, Rwh::Xlib(handle)) => handle.window as *mut ffi::c_void,
                    (WindowKind::Unknown | WindowKind::X11, Rwh::Xcb(handle)) => {
                        temp_xcb_handle = handle.window;
                        ptr::from_mut(&mut temp_xcb_handle).cast::<ffi::c_void>()
                    }
"""
          new_native = """                let mut wl_window = None;
                let (mut temp_xlib_handle, mut temp_xcb_handle);
                #[repr(C)]
                struct DarkFateFbdevWindow {
                    width16: u16,
                    height16: u16,
                    zero: u32,
                    width32: u32,
                    height32: u32,
                }
                let mut darkfate_fbdev_window = DarkFateFbdevWindow {
                    width16: config.extent.width as u16,
                    height16: config.extent.height as u16,
                    zero: 0,
                    width32: config.extent.width,
                    height32: config.extent.height,
                };
                let use_darkfate_fbdev =
                    cfg!(all(target_os = \"linux\", target_arch = \"arm\"));
                let native_window_ptr = match (self.wsi.kind, self.raw_window_handle) {
                    (WindowKind::Unknown | WindowKind::X11, Rwh::Xlib(handle)) => {
                        if use_darkfate_fbdev {
                            ptr::from_mut(&mut darkfate_fbdev_window).cast::<ffi::c_void>()
                        } else {
                            temp_xlib_handle = handle.window;
                            ptr::from_mut(&mut temp_xlib_handle).cast::<ffi::c_void>()
                        }
                    }
                    (WindowKind::AngleX11, Rwh::Xlib(handle)) => handle.window as *mut ffi::c_void,
                    (WindowKind::Unknown | WindowKind::X11, Rwh::Xcb(handle)) => {
                        if use_darkfate_fbdev {
                            ptr::from_mut(&mut darkfate_fbdev_window).cast::<ffi::c_void>()
                        } else {
                            temp_xcb_handle = handle.window;
                            ptr::from_mut(&mut temp_xcb_handle).cast::<ffi::c_void>()
                        }
                    }
"""
          if s.count(old_native) != 1:
              raise SystemExit("expected exactly one X11/XCB native window block")
          s = s.replace(old_native, new_native, 1)

          # Test17 used no EGL_RENDER_BUFFER override. Match that exactly on Linux ARM.
          old_attrs = """                let mut attributes = vec![
                    khronos_egl::RENDER_BUFFER,
                    // We don't want any of the buffering done by the driver, because we
                    // manage a swapchain on our side.
                    // Some drivers just fail on surface creation seeing `EGL_SINGLE_BUFFER`.
                    if cfg!(any(
                        target_os = \"android\",
                        target_os = \"macos\",
                        target_env = \"ohos\"
                    )) || cfg!(windows)
                        || self.wsi.kind == WindowKind::AngleX11
                    {
                        khronos_egl::BACK_BUFFER
                    } else {
                        khronos_egl::SINGLE_BUFFER
                    },
                ];
"""
          new_attrs = """                let mut attributes = if cfg!(all(
                    target_os = \"linux\",
                    target_arch = \"arm\"
                )) {
                    Vec::new()
                } else {
                    vec![
                        khronos_egl::RENDER_BUFFER,
                        // We don't want any of the buffering done by the driver, because we
                        // manage a swapchain on our side.
                        // Some drivers just fail on surface creation seeing `EGL_SINGLE_BUFFER`.
                        if cfg!(any(
                            target_os = \"android\",
                            target_os = \"macos\",
                            target_env = \"ohos\"
                        )) || cfg!(windows)
                            || self.wsi.kind == WindowKind::AngleX11
                        {
                            khronos_egl::BACK_BUFFER
                        } else {
                            khronos_egl::SINGLE_BUFFER
                        },
                    ]
                };
"""
          if s.count(old_attrs) != 1:
              raise SystemExit("expected exactly one EGL surface attributes block")
          s = s.replace(old_attrs, new_attrs, 1)

          p.write_text(s)
          print(f"Patched Linux ARM EGL presentation for DarkFate fbdev in {p}")
          PY

              cargo build --locked \
                --package ruffle_desktop \
                --release \
                --target armv7-unknown-linux-gnueabihf \
                --features jpegxr,fontconfig-dlopen

              mkdir -p /work/artifact-fbdev
              cp target/armv7-unknown-linux-gnueabihf/release/ruffle_desktop /work/artifact-fbdev/ruffle
              cp LICENSE.md /work/artifact-fbdev/LICENSE.md
              cp README.md /work/artifact-fbdev/README.md
              chmod +x /work/artifact-fbdev/ruffle
            '

      - name: Verify patched ARMHF compatibility
        run: |
          set -euxo pipefail
          file artifact-fbdev/ruffle
          readelf -h artifact-fbdev/ruffle
          readelf --version-info artifact-fbdev/ruffle | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tee glibc-versions-fbdev.txt
          MAX_GLIBC="$(tail -n 1 glibc-versions-fbdev.txt)"
          test "$MAX_GLIBC" = "GLIBC_2.27"
          readelf -d artifact-fbdev/ruffle | grep NEEDED | tee needed-libs-fbdev.txt
          ! grep -q 'libssl.so.3' needed-libs-fbdev.txt
          ! grep -q 'libcrypto.so.3' needed-libs-fbdev.txt
          sha256sum artifact-fbdev/ruffle | tee ruffle-fbdev.sha256

      - name: Package artifact
        run: |
          tar -C artifact-fbdev -czf ruffle-armhf-bionic-mali-fbdev.tar.gz .
          sha256sum ruffle-armhf-bionic-mali-fbdev.tar.gz | tee ruffle-armhf-bionic-mali-fbdev.tar.gz.sha256

      - name: Upload ARMHF Mali fbdev artifact
        uses: actions/upload-artifact@v7
        with:
          name: ruffle-armhf-bionic-mali-fbdev
          path: |
            ruffle-armhf-bionic-mali-fbdev.tar.gz
            ruffle-armhf-bionic-mali-fbdev.tar.gz.sha256
            ruffle-fbdev.sha256
            glibc-versions-fbdev.txt
            needed-libs-fbdev.txt
          if-no-files-found: error
